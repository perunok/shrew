[package]
name = "shrew"
description = "A tiny, fast, keyboard-first GPU text editor (vim + Sublime)."
version.workspace = true
edition.workspace = true
license.workspace = true

# `srw file` from a terminal. `shrew` is a symlink to it (scripts/install.sh, the release archives) and behaves the
# same; release assets keep the `shrew-<triple>` names the updater downloads.
[[bin]]
name = "srw"
path = "src/main.rs"

[features]
default = ["syntax", "picker", "clipboard", "mcp", "update", "embed-font", "project", "terminal", "git"]
# Syntax highlighting with Sublime grammars (syntect + fancy-regex, pure Rust), on a background thread.
syntax = ["dep:shrew-syntax"]
# Extra `.sublime-syntax` files from Sublime Text's Packages/User folders.
syntax-sublime-user = ["syntax", "shrew-syntax/sublime-user"]
# Fuzzy file picker (Ctrl+P), walking the project in the background.
picker = ["shrew-core/picker"]
# System clipboard (arboard: Wayland data-control and X11, pure Rust).
clipboard = ["dep:arboard"]
# MCP server so AI assistants can read and edit open buffers (off at runtime until enabled).
mcp = ["dep:shrew-mcp"]
# Self-update from GitHub Releases (pure-Rust TLS).
update = ["dep:shrew-update"]
# Bundle JetBrains Mono so the first frame never waits for a font scan.
embed-font = ["shrew-render/embed-font"]
# Project navigation: the sidebar file tree, find in project, the project symbol index (ignore crate, pure Rust).
project = ["shrew-core/project"]
# Built-in terminal panel (alacritty_terminal: VT parser, grid and PTY; pure Rust).
terminal = ["dep:alacritty_terminal", "dep:regex"]
# Git: the diff view and the rest of the git UI (gix reads in-process, writes through the git program).
git = ["dep:shrew-git"]

[dependencies]
shrew-core = { path = "../shrew-core", default-features = false }
shrew-render = { path = "../shrew-render", default-features = false }
shrew-config = { path = "../shrew-config" }
shrew-theme = { path = "../shrew-theme" }
shrew-syntax = { path = "../shrew-syntax", optional = true }
shrew-mcp = { path = "../shrew-mcp", optional = true }
shrew-update = { path = "../shrew-update", optional = true }
shrew-git = { path = "../shrew-git", optional = true }
winit.workspace = true
arboard = { workspace = true, optional = true }
log.workspace = true
env_logger.workspace = true
# single-instance requests (one JSON line each)
serde.workspace = true
serde_json = "1"
# the cache folder for recent files and projects
dirs = "6"
# the terminal: emulation and PTY, and finding file:line links in its output
alacritty_terminal = { version = "0.26", default-features = false, optional = true }
regex = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# getuid and setsid only (bindings, no C compiled)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# the single-instance endpoint's token
getrandom = "0.3"
