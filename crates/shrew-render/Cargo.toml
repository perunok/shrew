[package]
name = "shrew-render"
description = "shrew's GPU renderer: wgpu, a cached glyph atlas and instanced quads."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["embed-font"]
# Bundle JetBrains Mono (Regular/Bold/Italic, ~830 KB) so the first frame never waits for a font scan.
embed-font = []

[dependencies]
wgpu.workspace = true
cosmic-text = { workspace = true, features = ["shape-run-cache"] }
etagere.workspace = true
bytemuck.workspace = true
image.workspace = true
log.workspace = true
pollster.workspace = true
unicode-width.workspace = true
rustc-hash = "2"

# Only the backends each OS uses: Vulkan with a GL fallback on Linux and the BSDs, Metal on macOS, DX12 with a GL
# fallback on Windows (Vulkan there too, for drivers whose DX12 is broken). Fewer backends, a smaller binary.
[target.'cfg(not(any(target_os = "macos", target_os = "ios", windows)))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan", "gles"] }

[dev-dependencies]
# Only for examples/window.rs (a live-surface smoke test); the crate itself stays winit-free.
winit.workspace = true
