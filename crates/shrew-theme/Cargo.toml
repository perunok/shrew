[package]
name = "shrew-theme"
description = "shrew's themes: UI and syntax palettes as data, accents, custom themes, Sublime/TextMate scheme import."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Theme files (the same parser shrew-config already uses).
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# .sublime-color-scheme is JSON with comments.
serde_json = "1"
