# Shrew Dark: shrew's default. Warm, low-glare browns; terracotta keywords, sage strings, honey functions.
name = "Shrew Dark"
scheme = "dark"

[ui]
bg = "#1f1b18"
surface = "#181512"
surface-raised = "#262120"
surface-hover = "#342c25"
border = "#332c26"
border-strong = "#4a4038"
text = "#d8cec2"
text-muted = "#a09487"
text-faint = "#857a6e"
accent = "#eaa35e"
accent-fg = "#1f1b18"
accent-soft = "#3d3024"
accent-text = "#eaa35e"
selection = "#3d342c"
selection-inactive = "#312a24"
cursor = "#eaa35e"
cursor-fg = "#1f1b18"
current-line = "#27221e"
line-number = "#7a6f63"
line-number-active = "#c2b5a6"
indent-guide = "#2f2924"
indent-guide-active = "#4a4038"
whitespace = "#3f3730"
bracket-match = "#4a3d30"
search-match = "#4b3f26"
search-current = "#6e5229"
word-highlight = "#343029"
danger = "#ea7468"
success = "#adbd7e"
warning = "#e2b45e"
info = "#93bcae"
mode-normal = "#eaa35e"
mode-insert = "#adbd7e"
mode-visual = "#c9a2c6"
popup = "#181512"
popup-border = "#3a322b"

[syntax]
keyword = "#e0905f"
control = "#e0905f"
string = "#adbd7e"
string-escape = "#8fc2a6"
number = "#dcae68"
constant = "#e2a777"
comment = "#8a7f73"
doc-comment = "#968a7d"
function = "#e8c785"
method = "#e8c785"
type = "#93bcae"
builtin-type = "#93bcae"
property = "#dcae68"
variable = "#d8cec2"
parameter = "#d8cec2"
namespace = "#93bcae"
macro = "#c9a2c6"
attribute = "#c9a2c6"
tag = "#e0905f"
operator = "#a99d90"
punctuation = "#a99d90"
regex = "#8fc2a6"
heading = { fg = "#e8c785", bold = true }
link = { fg = "#93bcae", underline = true }
emphasis = "#d8cec2"
diff-added = "#adbd7e"
diff-removed = "#ea7468"
diff-changed = "#dcae68"
invalid = "#ea7468"
