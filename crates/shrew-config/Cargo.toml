[package]
name = "shrew-config"
description = "shrew's config file (TOML, comment-preserving writes) and importers for vimrc and Sublime Text settings/keymaps."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The engine's types only: syntax and the file picker are the app's business.
shrew-core = { path = "../shrew-core", default-features = false }
# One TOML parser for reading (with spans, for line numbers in warnings) and for edits that keep the user's comments.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Sublime's .sublime-settings / .sublime-keymap (JSON once comments and trailing commas are stripped).
serde_json = "1"
dirs = "6"
