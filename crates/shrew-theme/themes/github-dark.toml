# GitHub Dark: GitHub's dark editor theme (primer/github-vscode-theme).
# UI colors from Slinger's themes.css. Syntax colors marked "lifted" were made
# lighter/darker (same hue) to reach the contrast targets in docs/THEMES.md.
name = "GitHub Dark"
scheme = "dark"

[ui]
bg = "#0d1117"
surface = "#010409"
surface-raised = "#161b22"
surface-hover = "#1f242c"
border = "#30363d"
border-strong = "#484f58"
text = "#e6edf3"
text-muted = "#9198a1"
text-faint = "#6e7681"
accent = "#4493f8"
accent-fg = "#000204"
accent-soft = "#182b44"
accent-text = "#4493f8"
selection = "#18355a"
danger = "#f85149"
danger-fg = "#000204"
danger-soft = "#351c20"
success = "#3fb950"
success-soft = "#162e21"
warning = "#d29922"
warning-soft = "#2e2819"

[syntax]
keyword = "#ff7b72"
control = "#ff7b72"
string = "#a5d6ff"
string-escape = "#79c0ff"
number = "#79c0ff"
constant = "#79c0ff"
comment = "#8b949e"
doc-comment = "#8b949e"
function = "#d2a8ff"
method = "#d2a8ff"
type = "#ffa657"
builtin-type = "#ffa657"
property = "#79c0ff"
variable = "#c9d1d9"
parameter = "#c9d1d9"
namespace = "#ffa657"
macro = "#d2a8ff"
attribute = "#79c0ff"
tag = "#7ee787"
operator = "#ff7b72"
punctuation = "#c9d1d9"
regex = "#7ee787"
heading = { fg = "#79c0ff", bold = true }
link = { fg = "#a5d6ff", underline = true }
emphasis = "#c9d1d9"
diff-added = "#3fb950"
diff-removed = "#f85149"
diff-changed = "#ffa657"
invalid = "#f85149"
