# Light: Slinger's default light palette.
# UI colors from Slinger's themes.css. Syntax colors marked "lifted" were made
# lighter/darker (same hue) to reach the contrast targets in docs/THEMES.md.
name = "Light"
scheme = "light"

[ui]
bg = "#ffffff"
surface = "#f4f5f7"
surface-raised = "#eef0f3"
surface-hover = "#e4e7ec"
border = "#d9dde3"
border-strong = "#b4bbc6"
text = "#1c2330"
text-muted = "#566072"
text-faint = "#7b8494"
accent = "#2563eb"
accent-fg = "#ffffff"
accent-soft = "#dbe7fd"
accent-text = "#1f5ce4"
selection = "#bcd3fb"
danger = "#c62828"
danger-fg = "#ffffff"
danger-soft = "#fde4e4"
success = "#117d3a"
success-soft = "#dcf5e4"
warning = "#9e5a05"
warning-soft = "#fdeccb"

[syntax]
keyword = "#8a3ffc"
control = "#8a3ffc"
string = "#0a7a3d"
string-escape = "#b4306b"
number = "#b45309"
constant = "#b4306b"
comment = "#676f7f"
doc-comment = "#676f7f"
function = "#1d4ed8"
method = "#1d4ed8"
type = "#0e7490"
builtin-type = "#0e7490"
property = "#1c2330"
variable = "#1c2330"
parameter = "#1c2330"
namespace = "#0e7490"
macro = "#b4306b"
attribute = "#0e7490"
tag = "#b4306b"
operator = "#566072"
punctuation = "#566072"
regex = "#b4306b"
heading = { fg = "#1d4ed8", bold = true }
link = { fg = "#1d4ed8", underline = true }
emphasis = "#8a3ffc"
diff-added = "#117d3a"
diff-removed = "#c62828"
diff-changed = "#9e5a05"
invalid = "#c62828"
