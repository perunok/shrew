# Midnight: Deep blue night (Slinger).
# UI colors from Slinger's themes.css. Syntax colors marked "lifted" were made
# lighter/darker (same hue) to reach the contrast targets in docs/THEMES.md.
name = "Midnight"
scheme = "dark"

[ui]
bg = "#0d1630"
surface = "#070d1f"
surface-raised = "#131e40"
surface-hover = "#1a2853"
border = "#22335f"
border-strong = "#35508f"
text = "#dbe5ff"
text-muted = "#93a5d4"
text-faint = "#6f82b3"
accent = "#5b9dff"
accent-fg = "#04102b"
accent-soft = "#17306b"
accent-text = "#5b9dff"
selection = "#234a92"
danger = "#ff7a90"
danger-fg = "#03060e"
danger-soft = "#3d1a30"
success = "#57d9a3"
success-soft = "#0f3a3a"
warning = "#ffc36b"
warning-soft = "#3d3216"

[syntax]
keyword = "#b9a3ff"
control = "#b9a3ff"
string = "#8fe3b5"
string-escape = "#71dcf0"
number = "#ffb877"
constant = "#ff8fb3"
comment = "#6f82b3"
doc-comment = "#6f82b3"
function = "#7fb6ff"
method = "#7fb6ff"
type = "#ffd580"
builtin-type = "#ffd580"
property = "#dbe5ff"
variable = "#dbe5ff"
parameter = "#dbe5ff"
namespace = "#ffd580"
macro = "#71dcf0"
attribute = "#71dcf0"
tag = "#ff8fb3"
operator = "#93a5d4"
punctuation = "#93a5d4"
regex = "#71dcf0"
heading = { fg = "#7fb6ff", bold = true }
link = { fg = "#7fb6ff", underline = true }
emphasis = "#b9a3ff"
diff-added = "#57d9a3"
diff-removed = "#ff7a90"
diff-changed = "#ffc36b"
invalid = "#ff7a90"
