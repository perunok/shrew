# Catppuccin Mocha (catppuccin.com/palette, style guide).
# UI colors from Slinger's themes.css. Syntax colors marked "lifted" were made
# lighter/darker (same hue) to reach the contrast targets in docs/THEMES.md.
name = "Catppuccin Mocha"
scheme = "dark"

[ui]
bg = "#1e1e2e"
surface = "#181825"
surface-raised = "#262637"
surface-hover = "#313244"
border = "#45475a"
border-strong = "#585b70"
text = "#cdd6f4"
text-muted = "#a6adc8"
text-faint = "#7f849c"
accent = "#cba6f7"
accent-fg = "#0b0b11"
accent-soft = "#413956"
accent-text = "#cba6f7"
selection = "#55486c"
danger = "#f38ba8"
danger-fg = "#0b0b11"
danger-soft = "#423143"
success = "#a6e3a1"
success-soft = "#353f42"
warning = "#f9e2af"
warning-soft = "#433f44"

[syntax]
keyword = "#cba6f7"
control = "#cba6f7"
string = "#a6e3a1"
string-escape = "#f5c2e7"
number = "#fab387"
constant = "#fab387"
comment = "#9399b2"
doc-comment = "#9399b2"
function = "#89b4fa"
method = "#89b4fa"
type = "#f9e2af"
builtin-type = "#f9e2af"
property = "#b4befe"
variable = "#cdd6f4"
parameter = "#eba0ac"
namespace = "#b4befe"
macro = "#94e2d5"
attribute = "#f9e2af"
tag = "#89b4fa"
operator = "#89dceb"
punctuation = "#9399b2"
regex = "#f5c2e7"
heading = { fg = "#f38ba8", bold = true }
link = { fg = "#b4befe", underline = true }
emphasis = "#eba0ac"
diff-added = "#a6e3a1"
diff-removed = "#f38ba8"
diff-changed = "#f9e2af"
invalid = "#f38ba8"
