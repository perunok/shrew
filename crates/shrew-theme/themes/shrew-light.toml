# Shrew Light: warm paper, the dark theme's hues darkened for contrast.
name = "Shrew Light"
scheme = "light"

[ui]
bg = "#f7f2ea"
surface = "#ede6da"
surface-raised = "#f2ece2"
surface-hover = "#e0d5c4"
border = "#d9cebf"
border-strong = "#c4b6a3"
text = "#3a322b"
text-muted = "#685d52"
text-faint = "#857a6d"
accent = "#a9551f"
accent-fg = "#ffffff"
accent-soft = "#f2e3d5"
accent-text = "#9a4a1a"
selection = "#e2d6c3"
selection-inactive = "#e9e1d4"
cursor = "#a9551f"
cursor-fg = "#ffffff"
current-line = "#efe8dc"
line-number = "#8c8072"
line-number-active = "#4f463d"
indent-guide = "#e6ddd0"
indent-guide-active = "#cfc3b2"
whitespace = "#d6cbbb"
bracket-match = "#e6d3b8"
search-match = "#f0dca8"
search-current = "#e8bd72"
word-highlight = "#ebe2d3"
danger = "#b8352a"
success = "#56692a"
warning = "#8a5c00"
info = "#2f6390"
mode-normal = "#a9551f"
mode-insert = "#56692a"
mode-visual = "#84468a"
popup = "#ede6da"
popup-border = "#d0c4b3"

[syntax]
keyword = "#a4501f"
control = "#a4501f"
string = "#56692a"
string-escape = "#2f7356"
number = "#895a0b"
constant = "#935521"
comment = { fg = "#857a6d", italic = true }
doc-comment = "#7a6f62"
function = "#7d5800"
method = "#7d5800"
type = "#2c6b5f"
builtin-type = "#2c6b5f"
property = "#895a0b"
variable = "#3a322b"
parameter = "#3a322b"
namespace = "#2c6b5f"
macro = "#84468a"
attribute = "#84468a"
tag = "#a4501f"
operator = "#6b6056"
punctuation = "#6b6056"
regex = "#2f7356"
heading = { fg = "#7d5800", bold = true }
link = { fg = "#2c6b5f", underline = true }
emphasis = "#3a322b"
diff-added = "#56692a"
diff-removed = "#b8352a"
diff-changed = "#895a0b"
invalid = "#b8352a"
