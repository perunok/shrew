[package]
name = "shrew-mcp"
description = "shrew's MCP server: buffer tools for AI assistants, a localhost Streamable-HTTP endpoint and the stdio bridge clients launch."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The editing engine only; syntax and the file picker are the app's business.
shrew-core = { path = "../shrew-core", default-features = false }
regex.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json = "1"
tiny_http = "0.12"
# plain HTTP to 127.0.0.1 only: no TLS
ureq = { version = "3", default-features = false }
getrandom = "0.3"
dirs = "6"

[dev-dependencies]
tempfile = "3"
