[package]
name = "shrew-update"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pure-Rust TLS: rustls without its ring/aws-lc providers, the RustCrypto provider plugged in, Mozilla roots baked in.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = "=0.0.2-alpha"
sha2 = "0.10"
semver = "1"
serde = { workspace = true }
serde_json = "1"
log = { workspace = true }

[dev-dependencies]
tiny_http = "0.12"
