# Dark: Slinger's default dark palette.
# UI colors from Slinger's themes.css. Syntax colors marked "lifted" were made
# lighter/darker (same hue) to reach the contrast targets in docs/THEMES.md.
name = "Dark"
scheme = "dark"

[ui]
bg = "#1e2127"
surface = "#16181d"
surface-raised = "#262a32"
surface-hover = "#2f343d"
border = "#333944"
border-strong = "#4b5361"
text = "#e4e7ec"
text-muted = "#a0a8b6"
text-faint = "#7c8595"
accent = "#4c8dff"
accent-fg = "#0b1220"
accent-soft = "#1f3358"
accent-text = "#639cff"
selection = "#2c4a7c"
danger = "#ff6b6b"
danger-fg = "#0a0b0d"
danger-soft = "#45222a"
success = "#4cc38a"
success-soft = "#1c3a2c"
warning = "#f0b45a"
warning-soft = "#443417"

[syntax]
keyword = "#c792ea"
control = "#c792ea"
string = "#a5d67e"
string-escape = "#6fd3e6"
number = "#f6a86b"
constant = "#ff8ba7"
comment = "#7f8898"
doc-comment = "#7f8898"
function = "#7db4ff"
method = "#7db4ff"
type = "#ffcb6b"
builtin-type = "#ffcb6b"
property = "#e4e7ec"
variable = "#e4e7ec"
parameter = "#e4e7ec"
namespace = "#ffcb6b"
macro = "#6fd3e6"
attribute = "#6fd3e6"
tag = "#ff8ba7"
operator = "#89ddff"
punctuation = "#a0a8b6"
regex = "#6fd3e6"
heading = { fg = "#7db4ff", bold = true }
link = { fg = "#7db4ff", underline = true }
emphasis = "#c792ea"
diff-added = "#4cc38a"
diff-removed = "#ff6b6b"
diff-changed = "#f0b45a"
invalid = "#ff6b6b"
