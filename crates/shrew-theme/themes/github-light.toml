# GitHub Light: GitHub's light editor theme (primer/github-vscode-theme).
# UI colors from Slinger's themes.css. Syntax colors marked "lifted" were made
# lighter/darker (same hue) to reach the contrast targets in docs/THEMES.md.
name = "GitHub Light"
scheme = "light"

[ui]
bg = "#ffffff"
surface = "#f6f8fa"
surface-raised = "#eff2f5"
surface-hover = "#e7ebef"
border = "#d0d7de"
border-strong = "#afb8c1"
text = "#1f2328"
text-muted = "#59636e"
text-faint = "#6e7781"
accent = "#0969da"
accent-fg = "#ffffff"
accent-soft = "#ddeafa"
accent-text = "#0363d1"
selection = "#bdd6f2"
danger = "#cb1d2b"
danger-fg = "#ffffff"
danger-soft = "#f9e2e4"
success = "#0f7931"
success-soft = "#e1eee5"
warning = "#8e5f05"
warning-soft = "#f2ebde"

[syntax]
keyword = "#cf222e"
control = "#cf222e"
string = "#0a3069"
string-escape = "#0550ae"
number = "#0550ae"
constant = "#0550ae"
comment = "#6e7781"
doc-comment = "#6e7781"
function = "#8250df"
method = "#8250df"
type = "#953800"
builtin-type = "#953800"
property = "#0550ae"
variable = "#1f2328"
parameter = "#1f2328"
namespace = "#953800"
macro = "#8250df"
attribute = "#0550ae"
tag = "#116329"
operator = "#cf222e"
punctuation = "#1f2328"
regex = "#116329"
heading = { fg = "#0550ae", bold = true }
link = { fg = "#0a3069", underline = true }
emphasis = "#1f2328"
diff-added = "#116329"
diff-removed = "#82071e"
diff-changed = "#953800"
invalid = "#82071e"
